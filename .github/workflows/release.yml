name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ（例: v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Pack & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Pack @thorikiri/hatena-api-client
        run: |
          mkdir -p release-assets
          npm pack --workspace=@thorikiri/hatena-api-client --pack-destination release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.tgz --title "$RELEASE_TAG" --generate-notes
          fi
